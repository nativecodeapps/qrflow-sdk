name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]   # tests are TypeScript run by Node type-stripping (22.18+); the built package itself runs on Node 18+
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npm run build
      - run: npm test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m py_compile python/qrflow.py examples/python-fastapi/main.py examples/python-flask-webhook/app.py
